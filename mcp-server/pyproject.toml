[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "g6-control-mcp"
version = "0.1.0"
description = "MCP server to control a Zoom G6 multi-effects processor over USB MIDI (unofficial)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["mcp>=1.2,<2", "mido>=1.3", "python-rtmidi>=1.5"]

[project.scripts]
g6-mcp = "g6_mcp.server:main"

[tool.setuptools]
packages = ["g6_mcp"]

[tool.setuptools.package-data]
g6_mcp = ["data/*.json"]
